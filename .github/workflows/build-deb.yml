name: Build AOSP adbd Debian Packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, "24.04"]
    runs-on: ${{ matrix.runner }}
    # The rk3588 runner uses a GnuTLS-backed Git/libcurl. Keep the transport
    # on the broadly supported TLS 1.2 + HTTP/1.1 path for every Git process,
    # including the Node action's child process (global gitconfig alone is not
    # sufficient because checkout replaces HOME during initialization).
    env:
      GIT_SSL_VERSION: tlsv1.2
      # For the arm64 runner, set GIT_HTTP_PROXY to
      # http://127.0.0.1:15551. Windows forwards that runner-local port
      # directly to its local HTTP proxy on 127.0.0.1:5551.
      GIT_HTTP_PROXY: ${{ matrix.arch == 'arm64' && vars.GIT_HTTP_PROXY || '' }}
      GIT_CONFIG_COUNT: 2
      GIT_CONFIG_KEY_0: http.version
      GIT_CONFIG_VALUE_0: HTTP/1.1
      GIT_CONFIG_KEY_1: http.maxRequests
      GIT_CONFIG_VALUE_1: "1"
    # Untrusted fork code must not run on the organization's self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # The self-hosted Orange Pi runner occasionally terminates GitHub's TLS
      # connection while Git is negotiating HTTP/2. Configure the transport
      # before checkout; checkout copies the runner's global config into its
      # temporary HOME and uses these settings for the fetch and submodules.
      - name: Configure Git transport
        shell: bash
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.maxRequests 1
          git config --global http.sslVersion tlsv1.2
          if [[ -n "${GIT_HTTP_PROXY:-}" ]]; then
            git config --global http.proxy "$GIT_HTTP_PROXY"
          fi
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 600
          git config --global core.compression 0
      - name: Print runner network
        shell: bash
        run: |
          echo "hostname=$(hostname) user=$(id -un)"
          ifconfig -a 2>/dev/null || ip -br addr
          ip route || true
          ss -ltnp 2>/dev/null | grep -E '(:15551|:5551)' || true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check architecture and version
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(dpkg --print-architecture)" = "$EXPECTED_ARCH"
          VERSION=$(dpkg-parsechangelog -S Version)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF#refs/tags/v}" = "$VERSION"
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y build-essential debhelper cmake pkg-config patch \
            libbrotli-dev liblz4-dev libzstd-dev python3
      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b -j2
          mkdir -p output
          cp ../adbd_"${VERSION}"_"${{ matrix.arch }}".deb output/
      - name: Test packaged daemon
        run: |
          dpkg-deb -x output/*.deb build-package
          python3 tests/smoke.py build-package/usr/bin/adbd
          git submodule foreach --recursive 'git diff --exit-code && git diff --cached --exit-code'
      - name: Test packaged tools and gadget manager
        env:
          ANDROID_COMPAT_DISPLAY: ":65535"
          ANDROID_COMPAT_WIDTH: "1280"
          ANDROID_COMPAT_HEIGHT: "720"
        run: |
          python3 tests/test_usb_gadget.py
          multiarch=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          ln -sfn "$multiarch/android-compat" build-package/usr/lib/android-compat
          test -x build-package/usr/bin/usbdevice
          test -f build-package/usr/lib/systemd/system/usbdevice.service
          test "$(readlink build-package/etc/systemd/system/sysinit.target.wants/usbdevice.service)" = "/usr/lib/systemd/system/usbdevice.service"
          test "$(build-package/usr/bin/getprop ro.product.model)" = "RoboPi2"
          test "$(build-package/usr/bin/wm size)" = "Physical size: 1280x720"
          build-package/usr/bin/settings --help >/dev/null
          build-package/usr/bin/input --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: adbd-${{ env.VERSION }}-${{ matrix.arch }}
          path: output/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: adbd-*
          path: output
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: output/*.deb
